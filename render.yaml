services:
  - type: web
    name: aqi-forecaster
    env: python
    region: singapore   # closest free-tier region to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false         # enter manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    healthCheckPath: /
    autoDeploy: true        # redeploy automatically on push to main
